version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - productservice
      - customerservice
      - orderservice

  productservice:
    build:
      context: .
      dockerfile: ProductService/Dockerfile
    ports:
      - "5001:80"

  customerservice:
    build:
      context: .
      dockerfile: CustomerService/Dockerfile
    ports:
      - "5002:80"

  orderservice:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    ports:
      - "5003:80"