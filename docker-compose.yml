services:
    productservice:
      build: ./ProductService
      ports:
        - "5001:8080"
      networks:
        - egradnet

    orderservice:
      build: ./OrderService
      ports:
        - "5002:8080"
      networks:
        - egradnet
    
    customerservice:
      build: ./CustomerService
      ports:
        - "5003:8080"
      networks:
        - egradnet

    gateway:
     build: ./Gateway
     ports:
      - "8080:8080"
     depends_on:
      - productservice
      - orderservice
      - customerservice
     networks:
        - egradnet
networks:
  egradnet:
    driver: bridge
