version: '3.9'

services:
  product-service:
    build:
      context: ./ProductService
    container_name: product-service
    ports:
      - "8080:8080"
    networks:
      - microservices-net

  customer-service:
    build:
      context: ./CustomerService
    container_name: customer-service
    ports:
      - "8081:8081"
    networks:
      - microservices-net

  order-service:
    build:
      context: ./OrderService
    container_name: order-service
    ports:
      - "8082:8082"
    networks:
      - microservices-net

  api-gateway:
    build:
      context: ./Gateway
    container_name: gateway
    depends_on:
      - product-service
      - customer-service
      - order-service
    ports:
      - "5000:80"  
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge