version: "3.9"

services:

  product-service:
    build: ./ProductService
    container_name: product-service
    ports:
      - "5001:8080"
    networks:
      - microservices-net

  customer-service:
    build: ./CustomerService
    container_name: customer-service
    ports:
      - "5002:8080"
    networks:
      - microservices-net

  order-service:
    build: ./OrderService
    container_name: order-service
    ports:
      - "5003:8080"
    networks:
      - microservices-net

  gateway:
    build: ./Gateway
    container_name: gateway
    ports:
      - "5000:8080"
    depends_on:
      - product-service
      - customer-service
      - order-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
